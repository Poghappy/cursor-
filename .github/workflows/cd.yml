name: CD

on:
    push:
        branches: [main]
        tags:
            - "v*"

jobs:
    deploy-dev:
        name: 部署到开发环境
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop'
        environment:
            name: development
            url: https://dev.example.com
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: 安装依赖
              run: npm ci

            - name: 构建项目
              run: npm run build

            - name: 运行测试
              run: npm test

            - name: 部署到开发环境
              run: npm run deploy:dev

    deploy-staging:
        name: 部署到预发布环境
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        environment:
            name: staging
            url: https://staging.example.com
        needs: []
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: 安装依赖
              run: npm ci

            - name: 构建项目
              run: npm run build

            - name: 运行测试
              run: npm test

            - name: 部署到预发布环境
              run: npm run deploy:staging

    deploy-prod:
        name: 部署到生产环境
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        environment:
            name: production
            url: https://example.com
        needs: []
        steps:
            - name: 检出代码
              uses: actions/checkout@v4

            - name: 设置 Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: 安装依赖
              run: npm ci

            - name: 构建项目
              run: npm run build

            - name: 运行完整测试套件
              run: npm run full-cycle

            - name: 部署到生产环境
              run: npm run deploy:prod
              env:
                  NODE_ENV: production

            - name: 创建 GitHub Release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ github.ref }}
                  release_name: Release ${{ github.ref }}
                  draft: false
                  prerelease: false
