- id: US-003
  title: 购物车管理
  description: 作为用户，我希望能够管理购物车中的商品，以便灵活调整购买计划
  acceptanceCriteria:
    - 用户能够添加商品到购物车
    - 用户能够修改商品数量
    - 用户能够删除购物车中的商品
    - 购物车显示商品总价和数量
    - 购物车状态在用户会话中保持
  priority: medium
  storyPoints: 5
  status: draft
  assignee: 开发团队
